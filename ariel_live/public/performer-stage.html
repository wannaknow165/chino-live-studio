<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>האריה — תצוגה חיה</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#stage{position:absolute;inset:0;margin:auto;width:min(100vw,56.25vh);height:min(100vh,177.777vw);overflow:hidden;background:transparent}
#back,#front,#view{position:absolute;inset:0;width:100%;height:100%}#back{z-index:0}
#view{z-index:1}#front{z-index:2;pointer-events:none}#back img,#back video,#front img,#front video{width:100%;height:100%;object-fit:cover}
.royal{background:radial-gradient(ellipse at 50% 35%,#59412a55,transparent 65%),repeating-linear-gradient(90deg,#080909 0,#191710 2%,#090909 4%)}
.studio{background:radial-gradient(ellipse at 50% 30%,#273e57,#080d14 70%)}
#caption{position:absolute;z-index:3;bottom:10%;left:8%;right:8%;color:white;font:600 22px/1.4 system-ui;text-align:center;text-shadow:0 2px 5px #000;direction:auto}
#start{position:absolute;z-index:5;inset:35% 8%;border:1px solid #b69054;border-radius:20px;background:#131719ee;color:#e8c68e;font:600 22px system-ui;cursor:pointer}
#load{position:absolute;z-index:4;top:5%;left:7%;right:7%;font:16px system-ui;color:#fff;text-align:center}
body.vcam #stage::after{content:'';position:absolute;inset:0;border:4px solid #ff00ff;z-index:9;pointer-events:none}
body.clean #caption{display:none}
#design{display:none;position:fixed;z-index:12;bottom:14px;left:50%;transform:translateX(-50%);gap:6px;max-width:96vw;padding:7px;background:#101315e8;border:1px solid #b4945544;border-radius:14px;direction:rtl}
#design button{border:1px solid #7c694a;background:#222629;color:#e6d4af;padding:8px 10px;border-radius:8px;font:13px system-ui;cursor:pointer;white-space:nowrap}
#design{flex-wrap:wrap;justify-content:center;width:max-content}#gesture{background:#222629;color:#e6d4af;border:1px solid #7c694a;border-radius:8px;padding:7px;font:13px system-ui}
body.preview #design{display:flex}body.preview{background:#0a0d10}
</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body><div id="stage"><div id="back" class="royal"></div><canvas id="view"></canvas><div id="front"></div><div id="caption"></div>
<div id="load">טוען את האריה…</div><button id="start">הפעלת האריה והקול</button></div>
<nav id="design" aria-label="תצוגת עיצוב"><button data-view="upper">גוף וידיים</button><button data-view="face">ראש וידיים</button><button data-view="left">צד שמאל</button><button data-view="right">צד ימין</button><select id="gesture" aria-label="בדיקת תנועות"><option value="idle">מנוחה</option><option value="talk">מחוות דיבור</option><option value="react">תגובה עם הידיים</option><option value="mouth">יד לפה — בדיקת תנועה</option></select></nav>
<script type="module" src="/performer-stage.mjs"></script></body></html>
