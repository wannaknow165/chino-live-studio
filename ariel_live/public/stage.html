<!doctype html>
<html><head><meta charset="utf-8"><title>ARIEL STAGE</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
#wrap{position:absolute;inset:0;margin:auto;height:100vh;width:calc(100vh*9/16);max-width:100vw;max-height:calc(100vw*16/9)}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
video.on{opacity:1}
#poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* --- the three layers --- */
#bg{position:absolute;inset:0;z-index:0;background:#000;overflow:hidden}
#bg img,#bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;display:none}
#bgDim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#set{position:absolute;inset:0;z-index:1;transform-origin:50% 100%;will-change:transform}
#lion3d{position:absolute;inset:0;display:none;background:transparent}
#lion3d iframe,#lion3d video,#lion3d img{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;object-fit:contain;opacity:1;display:block}
body.m3d #A,body.m3d #B,body.m3d #poster{display:none}
body.m3d #lion3d{display:block}
body.noLion #set{display:none}   /* effects-only: no lion at all — the camera carries just the opponent screen + effects (+ background) */
#oppLive{position:absolute;inset:0;z-index:2;width:100%;height:100%;object-fit:cover;display:none;background:#000;opacity:1;transform-origin:50% 50%}
body.oppScreen #oppLive{display:block}
body.oppHidden #oppLive{display:block;opacity:0;pointer-events:none}   /* his live keeps playing invisibly — only his head is taken from it */
body.oppScreen #set{visibility:hidden}
#fxPool{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
#fxPool video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;display:block;background:transparent}
#fxPool video.on{opacity:1}
#fxPool video.flip{transform:scaleX(-1)}
#front{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
#front img,#front video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;display:block}
#clip{position:absolute;z-index:6;display:none;object-fit:contain;opacity:1;background:#000}
#clip.full{inset:0;width:100%;height:100%}
#clip.inset{left:auto;top:auto;right:3%;bottom:19%;width:48%;height:auto;aspect-ratio:9/16;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.7);border:3px solid rgba(217,164,65,.9);background:#000}
#clip.insetWide{left:auto;top:auto;right:3%;bottom:19%;width:60%;height:auto;aspect-ratio:16/9;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.7);border:3px solid rgba(217,164,65,.9);background:#000}
#clip.on{display:block}
#mute{position:absolute;top:2.2%;right:3%;z-index:8;display:none;font:700 clamp(12px,1.8vh,20px) system-ui;color:#fff;background:rgba(192,57,43,.9);padding:4px 10px;border-radius:10px}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#learn{position:absolute;top:2.2%;left:3%;z-index:8;pointer-events:none;display:none;align-items:center;gap:8px;direction:rtl}
#learn .badge{background:rgba(217,164,65,.92);color:#1a1208;font:800 clamp(12px,1.8vh,20px) system-ui;padding:4px 10px;border-radius:10px;letter-spacing:.06em}
#learn .src{color:#fff;font:600 clamp(11px,1.6vh,18px) system-ui;text-shadow:0 1px 4px #000}
#ticker{position:absolute;left:3%;right:3%;bottom:16%;z-index:8;pointer-events:none;display:none;direction:rtl;color:#ffe9b8;font:600 clamp(13px,2vh,24px) system-ui;text-shadow:0 1px 4px #000;background:rgba(0,0,0,.45);padding:6px 12px;border-radius:12px}
#caps{position:absolute;left:3%;right:3%;bottom:7%;z-index:8;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:flex-start;direction:rtl}
.cap{max-width:92%;padding:6px 12px;border-radius:14px;font:700 clamp(15px,2.3vh,28px) system-ui,Arial;line-height:1.35;text-shadow:0 1px 3px rgba(0,0,0,.9);background:rgba(0,0,0,.55);color:#fff;animation:capin .25s ease-out;transition:opacity .6s}
.cap.ariel{background:rgba(217,164,65,.88);color:#1a1208;text-shadow:none;align-self:flex-end}
.cap.opp{background:rgba(40,90,160,.85)}
.cap .who{opacity:.75;font-size:.72em;margin-inline-end:6px}
@keyframes capin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#label{position:absolute;top:2.2%;left:0;right:0;text-align:center;z-index:8;pointer-events:none;color:#ff2d2d;font:700 clamp(14px,2.2vh,26px) system-ui,Arial;letter-spacing:.12em;text-shadow:0 1px 6px rgba(0,0,0,.8);display:none}
#start{z-index:10;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#f3d27a;font:700 28px system-ui;cursor:pointer;text-align:center}
body.live #wrap{width:100vw;height:100vh;max-width:none;max-height:none}
/* OVERLAY mode: a transparent layer for TikTok LIVE Studio's "Link source" — only effects, captions, labels. The camera lives in Live Studio. */
html.overlay,body.overlay,body.overlay #wrap,body.overlay #bg{background:transparent !important}
body.overlay #bg,body.overlay #set,body.overlay #start{display:none !important}
body.live #fx{object-fit:cover}
body.vcam #wrap::after{content:'';position:absolute;inset:0;border:4px solid #ff00ff;z-index:9;pointer-events:none}
</style></head>
<body><div id="wrap">
<div id="bg"><img id="bgImg"><video id="bgVid" muted loop playsinline></video><div id="bgDim"></div></div>
<div id="set">
<img id="poster" src="/media/master.png">
<video id="A" playsinline preload="auto"></video>
<video id="B" playsinline preload="auto"></video>
<div id="lion3d"></div>
</div>
<video id="oppLive" playsinline preload="auto"></video>
<div id="front"></div>
<div id="fxPool"><video playsinline preload="auto" muted></video><video playsinline preload="auto" muted></video><video playsinline preload="auto" muted></video></div>
<video id="clip" playsinline preload="auto"></video>
<div id="mute">🔇</div>
<audio id="song"></audio>
<video id="ov" muted playsinline style="display:none"></video>
<canvas id="fx" width="1080" height="1920"></canvas>
<div id="label"></div>
<div id="caps"></div>
<div id="learn"><span class="badge">🎓 LEARNING</span><span class="src" id="learnSrc"></span></div>
<div id="ticker"></div>
<div id="start">לחץ פעם אחת<br>כדי להפעיל את האריה 🦁</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
<script>
const QS=new URLSearchParams(location.search);
if(QS.get('vcam')) document.body.classList.add('vcam');
if(QS.get('live')) document.body.classList.add('live');
const PREVIEW=!!QS.get('preview');   // the dashboard's silent preview: same picture, no sound, no side effects
const PATHN=location.pathname; const OVERLAY=!!QS.get('overlay')||PATHN==='/overlay'||PATHN==='/game'; if(OVERLAY){ document.documentElement.classList.add('overlay'); document.body.classList.add('overlay','live'); }
const LAYER=QS.get('layer')||(PATHN==='/game'?'game':'');   // 'game' = a separate Link source that shows ONLY the 🍅 head game; '' = clips, boxers, effects
const A=document.getElementById('A'), B=document.getElementById('B'), song=document.getElementById('song');
let front=A, back=B, idles=[], lastIdle=-1, mode='idle', talkQueue=[], dances=[], danceI=0, spDances=[], spSong=null, ducked=false, curSong=null, plOn=false, plList=[], plI=-1;
const pickFrom=l=>l[Math.floor(Math.random()*l.length)];

async function loadIdles(){ const s=await (await fetch('/api/state')).json(); idles=s.idles; idles.forEach(blobOf); }
function pickIdle(){ if(!idles.length) return null; let i; do{ i=Math.floor(Math.random()*idles.length);}while(idles.length>1&&i===lastIdle); lastIdle=i; return idles[i]; }

const R=msg=>PREVIEW?null:fetch('/api/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({msg})}).catch(()=>{});
window.onerror=(m)=>R('ERR '+m);
const AC=new (window.AudioContext||window.webkitAudioContext)();
const gains={};
function wire(el,name){ try{ const src=AC.createMediaElementSource(el); const g=AC.createGain(); src.connect(g); if(!PREVIEW) g.connect(AC.destination); gains[name]=g; }catch(e){ R('wire '+name+' '+e.message); } }
const CLIP=document.getElementById('clip'); wire(A,'A'); wire(B,'B'); wire(song,'song'); wire(CLIP,'clip');
let holdTalk=false, muted=false, lionOff=false;
function keepAudioAlive(){ if(AC.state!=='running'){ AC.resume().then(()=>R('audiocontext '+AC.state)).catch(e=>R('resume '+e.message)); } }
keepAudioAlive(); setInterval(keepAudioAlive, 2000);
const blobs=new Map();
async function blobOf(src){ if(blobs.has(src)) return blobs.get(src); const u=src.replace('/media/','/v/'); const b=await (await fetch(u)).blob(); const url=URL.createObjectURL(new Blob([b],{type: src.endsWith('.webm')?'video/webm':'video/mp4'})); blobs.set(src,url); return url; }
async function play(src,{muted=false,loop=false}={}){
  const v=back; v.src=await blobOf(src); v.muted=false; const gn=gains[v===A?'A':'B']; if(gn) gn.gain.value=muted?0:1; v.loop=loop; v.currentTime=0; keepAudioAlive();
  return v.play().then(()=>{ if(!muted) R('playing talk '+src); v.classList.add('on'); front.classList.remove('on'); const old=front; old.pause(); old.playbackRate=1; back=front; front=v; v.onended=onEnded; }).catch(e=>{ R('play failed '+src+' '+e.name+': '+e.message); if(!muted && e.name==='NotAllowedError'){ document.getElementById('wrap').insertAdjacentHTML('beforeend','<div id="start" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#f3d27a;font:700 28px system-ui;cursor:pointer">לחץ כדי להפעיל סאונד</div>'); document.getElementById('start').onclick=e2=>{ e2.target.remove(); v.play(); }; } });
}
function songOn(){ return curSong && !song.paused && !song.ended; }
function inChorus(){ const x=song.currentTime; return (curSong.chorus||[]).some(([s,e])=> x>=s-4 && x<e-2); }
function onEnded(){
  if(lionOff){ try{ front.pause(); }catch(e){} return; }
  if(talkQueue.length && !holdTalk && !muted) return playTalk(talkQueue.shift());
  fadeSong(1); if(ducked){ ducked=false; if(!PREVIEW) fetch('/api/duck',{method:'POST',body:JSON.stringify({on:false})}); }
  if(songOn()){ mode='song'; const sing=inChorus() && curSong.sings.length; const l=sing?curSong.sings:curSong.dances; if(l.length) return play(pickFrom(l),{muted:true}); }
  if(spSong && spSong.dances.length){ mode='dance'; const pos=(Date.now()-spSong.since)/1000; const sing=spSong.sings.length && (spSong.chorus||[]).some(([s,e])=>pos>=s-4&&pos<e-2); return play(pickFrom(sing?spSong.sings:spSong.dances),{muted:true}); }
  mode='idle'; const s=pickIdle(); if(s) play(s,{muted:true});
}
let fadeT=null;
function fadeSong(to){ clearInterval(fadeT); const g=gains.song; if(!g){ song.volume=to; return; } fadeT=setInterval(()=>{ const v=g.gain.value+(to-g.gain.value)*0.3; g.gain.value=Math.abs(v-to)<0.02?to:v; if(g.gain.value===to) clearInterval(fadeT); },60); }
function startSong(s){ curSong=s; [...s.dances,...s.sings].forEach(blobOf); song.src=s.audio; song.currentTime=0; song.volume=1; song.play().then(()=>R('song '+s.name)).catch(e=>R('song failed '+e.message));
  song.onended=()=>{ curSong=null; if(plOn) setTimeout(nextPl, 6000); }; if(front.paused||!front.src) onEnded(); }
function nextPl(){ if(!plOn||!plList.length) return; plI=(plI+1)%plList.length; startSong(plList[plI]); }
function playTalk(file){ mode='talk'; if(songOn()) fadeSong(0.55); if(spSong && !ducked && !PREVIEW){ ducked=true; fetch('/api/duck',{method:'POST',body:JSON.stringify({on:true})}); } play(file,{muted:false}); }



// ---------- opponent head overlay (fixed effects) ----------
const FX=document.getElementById('fx'), fc=FX.getContext('2d');
let capsOn=true, trainingOn=false, tickerT=null;
function setTraining(m){ trainingOn=!!m.on; document.getElementById('learn').style.display=trainingOn?'flex':'none'; if(!trainingOn){ document.getElementById('ticker').style.display='none'; } }
function showTicker(txt){ const k=document.getElementById('ticker'); k.textContent='💡 '+txt; k.style.display='block'; clearTimeout(tickerT); tickerT=setTimeout(()=>k.style.display='none',8000); }
function addCap(who,text){ if(who==='chat') return; const box=document.getElementById('caps'); const d=document.createElement('div'); d.className='cap '+(who==='ariel'?'ariel':'opp'); d.innerHTML=`<span class="who">${who==='ariel'?'צ׳ינו':'היריב'}</span>${text}`; box.appendChild(d); while(box.children.length>3) box.firstChild.remove(); setTimeout(()=>{ d.style.opacity='0'; setTimeout(()=>d.remove(),700); }, 9000); }
let ovOn=false, ovTrack=null, ovFade=0, ovHead=null, ovAttached=null, ovT0=0, ovOffT0=0, ovLastOn=false; const OV=document.getElementById('ov');
// ---- 🍅 the head game: the opponent's REAL head, big, on our stage; tomatoes (and whatever else) land on it, it squashes, the splat stays ----
let game={on:false,user:'',still:'',x:0.5,y:0.70,size:0.46}, gameImg=null, gameSq={t0:0,p:0,dir:1}, splats=[], gameFade=0;
function gameHit(power=1,dir=1){ gameSq={t0:performance.now(),p:Math.min(1.6,power),dir}; const W=FX.width,H=FX.height; const r=W*game.size*0.5; flashUntil=performance.now()+90;
  for(let i=0;i<3;i++) splats.push({t0:performance.now()+i*40, dx:(Math.random()-.5)*r*0.9, dy:(Math.random()-.5)*r*0.9, r:r*(0.22+Math.random()*0.22), drips:[...Array(3+Math.floor(Math.random()*3))].map(()=>({x:(Math.random()-.5)*0.8, len:0.4+Math.random()*1.1, w:0.08+Math.random()*0.1}))}); }
// ---- Chino's conversation state (from Codex's director, via our server): a small pill for the viewers — never technical text ----
let director={online:false,conv:{active:false,state:'',secondsLeft:null},hint:''}, dirFade=0, dirPulse=0;
function drawDirector(now){
  if(LAYER==='game' || !OVERLAY || !QS.has('hint')) return;   // Shahak 2026-11-09: the Link layer is CLEAN by default (no 'write a question' banner); ?hint=1 brings the banner back
  const show=director.online && !(CLIP && CLIP.classList.contains('on'));   // hidden while a full-screen clip covers the camera
  dirFade+=((show?1:0)-dirFade)*0.12; if(dirFade<0.02) return;
  const W=FX.width,H=FX.height; const c=director.conv||{}; const st=String(c.state||'').toLowerCase();
  const speaking=/speak|talk|say|מדבר/.test(st), waiting=/wait|pending|missing|clip|מחכה/.test(st)&&!speaking;
  let text, dot; if(c.active){ if(waiting){ text='⏳ רגע, צ׳ינו חושב…'; dot='#f0a030'; } else if(speaking){ text='צ׳ינו מדבר'; dot='#4cd964'; } else { text='צ׳ינו מקשיב'; dot='#4cd964'; } }
  else { text=director.hint||'כתבו שאלה בצ׳אט — צ׳ינו 🦁 עונה'; dot=''; }
  const secs=c.active && c.secondsLeft!=null ? Math.max(0,Math.round(+c.secondsLeft)) : null;
  fc.save(); fc.globalAlpha=Math.min(1,dirFade)*(c.active?0.95:0.78); fc.direction='rtl'; fc.textAlign='center'; fc.textBaseline='middle';
  const fs=Math.round(H*0.021); fc.font=`600 ${fs}px "Heebo","Segoe UI","Arial",sans-serif`;
  const label=text+(secs!=null?`  ·  ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`:''); const tw=fc.measureText(label).width; const padX=fs*0.9, h=fs*2.1, w=tw+padX*2+(dot?fs*1.3:0);
  const x=W/2-w/2, y=H*0.205-h/2;
  fc.fillStyle=c.active?'rgba(10,12,16,0.72)':'rgba(10,12,16,0.55)'; fc.beginPath(); fc.roundRect(x,y,w,h,h/2); fc.fill();
  if(c.active){ fc.lineWidth=2; fc.strokeStyle=dot; fc.globalAlpha*=0.9; fc.stroke(); fc.globalAlpha=Math.min(1,dirFade)*0.95; }
  if(dot){ dirPulse=(now/600)%(Math.PI*2); const r=fs*0.32*(1+0.18*Math.sin(dirPulse)); fc.fillStyle=dot; fc.beginPath(); fc.arc(x+w-padX-fs*0.3, y+h/2, r, 0, Math.PI*2); fc.fill(); }
  fc.fillStyle='#fff'; fc.fillText(label, x+w/2-(dot?fs*0.65:0), y+h/2+1);
  fc.restore();
}
let tomatoHeads=[], smears=[], chunks=[];
function faceTomato(){ const W=FX.width,H=FX.height; const live=headBmp && Date.now()-headSeenAt<1200; const img=live?headBmp:(gameImg&&gameImg.complete&&gameImg.naturalWidth?gameImg:null); if(!img) return;
  // a frozen copy of her face at throw time (so each tomato keeps its own face)
  const c=document.createElement('canvas'); c.width=c.height=256; c.getContext('2d').drawImage(img,0,0,256,256);
  const x1=W*(0.35+Math.random()*0.3), y1=H*(0.36+Math.random()*0.18); const big=W*(0.5+(game.size||0.46)*0.9);
  tomatoHeads.push({t0:performance.now(), dur:1100, img:c, x0:W*(0.3+Math.random()*0.4), y0:H*0.92, x1, y1, s0:W*0.05, s1:big, spin:(Math.random()-0.5)*1.6, wob:Math.random()*6}); }
function drawTomatoHead(img, x, y, s, rot){ fc.save(); fc.translate(x,y); fc.rotate(rot);
  // HIS REAL HEAD, as it is (the cut-out already has its own transparency) — a soft shadow so it pops off the camera picture
  fc.shadowColor='rgba(0,0,0,.45)'; fc.shadowBlur=s*0.08; fc.shadowOffsetY=s*0.04;
  fc.drawImage(img,-s/2,-s/2,s,s); fc.restore(); }
function drawFaceTomatoes(now){ const W=FX.width,H=FX.height;
  tomatoHeads=tomatoHeads.filter(t=>{ const p=(now-t.t0)/t.dur; if(p>=1){ // BOOM: chunks of her face fly out, the face smears down the screen, juice everywhere
      for(let i=0;i<16;i++){ const a=Math.random()*Math.PI*2, v=(0.35+Math.random()*0.9)*W*0.012; const n=3+Math.floor(Math.random()*3); const poly=[...Array(n)].map((_,k)=>{ const an=k/n*Math.PI*2+Math.random()*0.6, rr=0.55+Math.random()*0.45; return [Math.cos(an)*rr, Math.sin(an)*rr]; }); chunks.push({t0:now, img:t.img, x:t.x1, y:t.y1, vx:Math.cos(a)*v, vy:Math.sin(a)*v-W*0.006, r:t.s1*(0.07+Math.random()*0.12), u:Math.random()*0.75, w:Math.random()*0.75, rot:Math.random()*6, vr:(Math.random()-0.5)*0.3, poly}); }
      smears.push({t0:now, img:t.img, x:t.x1, y:t.y1, s:t.s1*1.1}); gameHit(1.2, Math.random()<0.5?-1:1); flashUntil=now+100; shakeUntil=now+300; return false; }
    const e=1-Math.pow(1-p,2.0); const x=t.x0+(t.x1-t.x0)*e + Math.sin(p*9+t.wob)*W*0.015*(1-p), y=t.y0+(t.y1-t.y0)*e - Math.sin(p*Math.PI)*H*0.06, s=t.s0+(t.s1-t.s0)*Math.pow(p,2.6);   // perspective: slow far away, rushing at the camera at the end
    drawTomatoHead(t.img,x,y,s,t.spin*p + Math.sin(p*14+t.wob)*0.06*(1-p)); return true; });
  // the smear: her face, stretched and dripping down like a tomato on a window, fading out
  smears=smears.filter(sm=>{ const a=(now-sm.t0)/1000; if(a>2.8) return false; const fade=a<1.6?1:1-(a-1.6)/1.2; fc.save(); fc.globalAlpha=0.9*fade;
    const S=sm.s*(1+a*0.08), cols=18; const cw=S/cols;
    for(let i=0;i<cols;i++){ const u=i/cols; const drop=Math.pow(Math.sin(u*Math.PI*3.1+i)*0.5+0.5,2)*S*a*0.9; const sx=i*256/cols; fc.save(); fc.beginPath(); fc.ellipse(sm.x, sm.y+drop*0.5, S/2, S/2+drop, 0, 0, Math.PI*2); fc.clip();
      fc.drawImage(sm.img, sx,0,256/cols,256, sm.x-S/2+i*cw, sm.y-S/2, cw+1, S+drop); fc.restore(); }
    fc.globalCompositeOperation='source-atop'; fc.fillStyle=`rgba(230,35,30,${0.22*fade})`; fc.beginPath(); fc.ellipse(sm.x, sm.y+S*a*0.15, S*0.5, S*0.52+S*a*0.3, 0, 0, Math.PI*2); fc.fill(); fc.restore(); return true; });
  chunks=chunks.filter(ch=>{ const a=(now-ch.t0)/1000; if(a>1.6) return false; ch.x+=ch.vx; ch.y+=ch.vy; ch.vy+=W*0.0007; ch.rot+=ch.vr; fc.save(); fc.globalAlpha=a<1.1?1:1-(a-1.1)/0.5; fc.translate(ch.x,ch.y); fc.rotate(ch.rot); fc.beginPath(); ch.poly.forEach(([px,py],k)=>k?fc.lineTo(px*ch.r,py*ch.r):fc.moveTo(px*ch.r,py*ch.r)); fc.closePath(); fc.clip(); fc.drawImage(ch.img, ch.u*256, ch.w*256, 64, 64, -ch.r, -ch.r, ch.r*2, ch.r*2); fc.restore(); return true; }); }
function drawGame(now){
  if(LAYER!=='game') return;
  try{ drawFaceTomatoes(now); }catch(e){}
  if(!game.on && gameFade<0.02) return; gameFade+=((game.on?1:0)-gameFade)*0.2;
  const W=FX.width,H=FX.height; const cx=W*game.x, cy=H*game.y, S=W*game.size;
  if(game.showHead===false) return;

        const nb={cx,cy,sz}; oppFace=oppFace&&Date.now()-oppFaceAt<600?{cx:oppFace.cx+(nb.cx-oppFace.cx)*0.5,cy:oppFace.cy+(nb.cy-oppFace.cy)*0.5,sz:oppFace.sz+(nb.sz-oppFace.sz)*0.4}:nb; oppFaceAt=Date.now();
        // the head cut-out for bubbles/crowns/characters comes straight from his live (soft round mask)
        hcc.globalCompositeOperation='source-over'; hcc.clearRect(0,0,HR,HR); hcc.drawImage(FV, oppFace.cx-oppFace.sz/2, oppFace.cy-oppFace.sz/2, oppFace.sz, oppFace.sz, 0,0,HR,HR); maskHead();
        const bmp=await createImageBitmap(headC); if(headBmp) headBmp.close(); headBmp=bmp; headSeenAt=Date.now(); localHead=true;
        // the main stage shares what it found, so the dashboard preview and the Live Studio overlay show the same head without detecting again
        if(!PREVIEW && !OVERLAY && Date.now()-lastHeadShare>80){ lastHeadShare=Date.now(); const WR=document.getElementById('wrap'); const fs=faceScreen(); headC.toBlob(b=>{ if(b) fetch('/api/head/frame',{method:'POST',body:b}).catch(()=>{}); },'image/webp',0.86); if(fs) fetch('/api/face',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({on:true,x:fs.x/WR.clientWidth,y:fs.y/WR.clientHeight,s:fs.size/WR.clientWidth,vw:1080,vh:1920,mirror:false})}).catch(()=>{}); } }
      else if(Date.now()-oppFaceAt>1200){ if(oppFace && !PREVIEW && !OVERLAY) fetch('/api/face',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({on:false})}).catch(()=>{}); oppFace=null; localHead=false; } } }catch(e){} faceBusy=false; }
  else if(!on){ oppFace=null; localHead=false; }

}
faceLoop();
function remoteScreen(){ const f=remoteFace; if(!f||!f.on||Date.now()-f.t>1200||!f.vw) return null; const W=document.getElementById('wrap').clientWidth, H=document.getElementById('wrap').clientHeight; const k=Math.max(W/f.vw,H/f.vh); const ox=(W-f.vw*k)/2, oy=(H-f.vh*k)/2; const fx=f.mirror?1-f.x:f.x; return {x:ox+fx*f.vw*k, y:oy+f.y*f.vh*k, size:f.s*f.vw*k}; }
function faceScreen(){ if(game.on && LAYER==='game'){ const WR=document.getElementById('wrap'); const W=WR.clientWidth||FX.width, H=WR.clientHeight||FX.height; return {x:W*game.x, y:H*game.y, size:W*game.size*0.72, game:true}; } if(oppFace&&Date.now()-oppFaceAt<=1200){ const p=vidToScreen(oppFace.cx,oppFace.cy); return {x:p.x,y:p.y,size:oppFace.sz*p.k}; } return remoteScreen(); }
// ---------- one-shot transparent effects (punches…): up to 3 at once; by default they land ON THE FACE ----------
const FXP=[...document.querySelectorAll('#fxPool video')]; let fxI=0;
async function fxPlay(m){
  const v=FXP[fxI]; fxI=(fxI+1)%FXP.length;
  v.className=''; v.onended=null; v.pause(); v.src=await blobOf(m.file); v.currentTime=0; v.muted=true; v.loop=false;
  v.style.objectPosition='center'; v.style.transformOrigin='50% 50%';
  const WR=document.getElementById('wrap'); const W=WR.clientWidth, H=WR.clientHeight; const sc=+m.scale||1; const ix=m.impact&&m.impact.x!=null?+m.impact.x:0.5, iy=m.impact&&m.impact.y!=null?+m.impact.y:0.42;
  const face=(m.aim!=='full')?faceScreen():null;
  let dx=0, dy=0, fs=sc;
  if(face){ if(face.game) fs=Math.min(0.9, Math.max(0.25, (face.size*1.6)/Math.min(W,H)))*sc;             // on the game head: about two heads wide, never the whole screen
    else if(m.fit!==false) fs=Math.min(1.6, Math.max(0.45, (face.size*2.6)/(W*0.75)))*sc;              // the glove ends up about 2.6 heads wide
    const ixx=m.flip?1-ix:ix; const px=W/2+(ixx*W-W/2)*fs, py=H/2+(iy*H-H/2)*fs; dx=face.x-px; dy=face.y-py; }
  v.style.transition='none';
  const finalT=`translate(${dx}px, ${dy}px) ${m.flip?'scaleX(-1) ':''}scale(${fs})`;
  if(face && face.game){   // thrown FROM THE CHAT: starts small at the bottom, flies up to the face and lands exactly when the splat starts
    const secs0=+m.secs||1; const fly=Math.max(250, (m.hitAt!=null?+m.hitAt:0.2)*secs0*1000);
    const sx=(Math.random()-0.5)*W*0.6; v.style.transform=`translate(${dx+sx}px, ${H*0.62}px) ${m.flip?'scaleX(-1) ':''}scale(${fs*0.22})`;
    void v.offsetWidth; v.style.transition=`transform ${fly}ms cubic-bezier(.25,.6,.35,1)`; }
  v.style.transform=finalT;
  R('fx '+(face?'→ face':'center')+' '+m.file);
  v.play().then(()=>{ v.classList.add('on'); if(face && m.hit!==false){ const secs=+m.secs||v.duration||1; const at=(m.hitAt!=null?+m.hitAt:0.6)*secs*1000; setTimeout(()=>hitFace(m.flip?-1:1, m.power||1), Math.max(60,at)); } }).catch(e=>R('fx failed '+e.message));
  v.onended=()=>{ v.classList.remove('on'); };
}
// ---------- THE HIT: when the glove lands, his live head whips sideways, the frame shakes, stars fly ----------
let shakeUntil=0, flashUntil=0;
function hitFace(dir=1, power=1){
  if(LAYER==='game'){ if(game.on) gameHit(power,dir); return; }
  const WR=document.getElementById('wrap'); const kx=(WR.clientWidth||1)/FX.width, ky=(WR.clientHeight||1)/FX.height;
  const ovH=(ovOn && ovTrack && ovTrack.swap!==false && ovHead && performance.now()-ovHead.t<300) ? {x:ovHead.x*kx, y:ovHead.y*ky, size:ovHead.size*kx, ov:true} : null;
  const f=ovH||faceScreen(); if(!f||!headBmp) return;
  // a snapshot of the head at impact time, so the whipped head is HIS head of this very moment
  const snap=document.createElement('canvas'); snap.width=snap.height=HR; snap.getContext('2d').drawImage(headBmp,0,0,HR,HR);
  const loc=!f.ov && oppFace&&Date.now()-oppFaceAt<=1200; hits.push({t0:performance.now(), dir, power, ov:!!f.ov, x:f.x, y:f.y, size:f.size, snap, vx:loc?oppFace.cx:0, vy:loc?oppFace.cy:0, vs:loc?oppFace.sz:0});
  shakeUntil=performance.now()+320; flashUntil=performance.now()+140; R('HIT face dir='+dir);
}
function drawHits(now){
  hits=hits.filter(h=>now-h.t0<520);
  const WR=document.getElementById('wrap'); const W=FX.width, H=FX.height, sx=W/(WR.clientWidth||W), sy=H/(WR.clientHeight||H);
  // frame shake on the opponent's live
  if(now<shakeUntil){ const k=(shakeUntil-now)/320; const ox=(Math.random()-.5)*26*k, oy=(Math.random()-.5)*18*k; if(document.body.classList.contains('oppScreen')) OPPV.style.transform=`translate(calc(${+curView.x||0}% + ${ox}px), calc(${+curView.y||0}% + ${oy}px)) scale(${+curView.scale||1})`; else if(camStream) bgVid.style.transform=(bgVid.dataset.mirror?'scaleX(-1) ':'')+`translate(${ox}px,${oy}px)`; }
  else if(OPPV.dataset.shook){ delete OPPV.dataset.shook; OPPV.style.transform=`translate(${+curView.x||0}%, ${+curView.y||0}%) scale(${+curView.scale||1})`; if(camStream) bgVid.style.transform=bgVid.dataset.mirror?'scaleX(-1)':''; }
  if(now<shakeUntil) OPPV.dataset.shook='1';
  if(now<flashUntil){ fc.save(); fc.globalAlpha=0.35*((flashUntil-now)/140); fc.fillStyle='#fff'; fc.fillRect(0,0,W,H); fc.restore(); }
  for(const h of hits){
    const age=(now-h.t0)/520, p=Math.sin(Math.min(1,age)*Math.PI);           // out and back
    const cx=h.x*sx, cy=h.y*sy, r=h.size*sx/2;
    // 1) smear the real face (motion blur) so the original head isn't seen twice
    const SV=faceSrc(); if(SV && SV.videoWidth && h.vs){ fc.save(); fc.beginPath(); fc.arc(cx,cy,r*1.15,0,Math.PI*2); fc.clip(); fc.filter=`blur(${Math.round(10+14*p)}px)`; fc.globalAlpha=0.95; fc.drawImage(SV, h.vx-h.vs*0.75, h.vy-h.vs*0.75, h.vs*1.5, h.vs*1.5, cx-r*1.5, cy-r*1.5, r*3, r*3); fc.restore(); }
    // 2) the whipped head: thrown sideways, rotated, squashed, with a ghost trail
    const off=r*0.9*p*h.power*h.dir, rot=0.5*p*h.dir*h.power, up=-r*0.25*p;
    for(let g=3;g>=0;g--){ const q=Math.max(0,p-g*0.12); const ox=r*0.9*q*h.power*h.dir, oy=-r*0.25*q; fc.save(); fc.globalAlpha=g?0.18:1; fc.translate(cx+ox, cy+oy); fc.rotate(0.5*q*h.dir*h.power); fc.scale(1-0.18*q, 1+0.1*q); fc.drawImage(h.snap, -r, -r, r*2, r*2); fc.restore(); }
    // 3) stars + impact burst at the contact point
    const ex=cx-h.dir*r*0.8, ey=cy-r*0.1, a=1-Math.min(1,age);
    fc.save(); fc.globalAlpha=a; fc.translate(ex,ey); fc.rotate(age*2);
    fc.fillStyle='#ffe14d'; star(fc, 0,0, r*(0.9+0.8*age), 10); fc.fillStyle='#fff'; star(fc, 0,0, r*(0.45+0.4*age), 8);
    fc.font=`700 ${Math.round(r*0.55)}px Impact, "Arial Black", system-ui`; fc.textAlign='center'; fc.textBaseline='middle'; fc.fillStyle='#c0392b'; fc.lineWidth=r*0.06; fc.strokeStyle='#fff'; fc.strokeText('POW!',0,0); fc.fillText('POW!',0,0); fc.restore();
    for(let i=0;i<6;i++){ const an=i/6*Math.PI*2+age*1.5, d=r*(0.6+1.6*age); fc.save(); fc.globalAlpha=a; fc.font=`${Math.round(r*0.35)}px "Segoe UI Emoji",sans-serif`; fc.textAlign='center'; fc.fillText(i%2?'⭐':'💫', ex+Math.cos(an)*d, ey+Math.sin(an)*d); fc.restore(); }
  }
}
function star(c,cx,cy,R,n){ c.beginPath(); for(let i=0;i<n*2;i++){ const a=Math.PI*i/n, rr=i%2?R*0.45:R; c.lineTo(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr); } c.closePath(); c.fill(); }

const es=new EventSource('/api/events');
es.onmessage=async ev=>{
  const m=JSON.parse(ev.data);
  if(m.type==='hello'){ if(window.__boot&&m.boot&&window.__boot!==m.boot){ R('server restarted → reload'); location.reload(); } window.__boot=m.boot; }
  if(m.type==='oppLive'){ oppScreen(m); }
  if(m.type==='fx'){ if(!!m.game===(LAYER==='game')) fxPlay(m); }   // tomatoes → the game layer only; punches/effects → the main layer only
  if(m.type==='director'){ director={...director,...m}; }
  if(m.type==='tomatoface'){ if(LAYER==='game' && game.on) for(let i=0;i<(m.n||1);i++) setTimeout(faceTomato, i*140); }
  if(m.type==='headgame'){ game={...game,...m}; if(m.still){ gameImg=new Image(); gameImg.src=m.still+'?'+Date.now(); } else gameImg=null; if(!m.on) splats=[]; }
  if(m.type==='hit'){ if(LAYER!=='game') hitFace(m.dir||1, m.power||1); }
  if(m.type==='face'){ remoteFace=m; }
  if(m.type==='set'){ applySet(m); }
  if(m.type==='clip'){ clipPlay(m); }
  if(m.type==='clipStop'){ clipDone(); }
  if(m.type==='mute'){ setMuted(m.on); }
  if(m.type==='head'){ head={on:m.on,fx:m.fx}; }
  if(m.type==='convo' && capsOn){ addCap(m.who, m.text); }
  if(m.type==='trainingMode'){ setTraining(m); }
  if(m.type==='training'){ if(m.learned) showTicker(m.learned); }
  if(m.type==='study'){ document.getElementById('learnSrc').textContent=m.on&&m.name?('לומד מ: '+m.name):''; }
  if(m.type==='caps'){ capsOn=!!m.on; if(!capsOn) document.getElementById('caps').innerHTML=''; }
  if(m.type==='label'){ const L=document.getElementById('label'); L.textContent=m.text||''; L.style.display=(m.on&&m.text)?'block':'none'; L.style.color=m.color||'#ff2d2d'; }
  if(m.type==='overlay' && LAYER!=='game'){ ovTrack=m.track; ovTrack.hitDone=false; OV.src=await blobOf(m.webm); OV.loop=!!m.loop; OV.currentTime=0; OV.play().then(()=>{ ovOn=true; R('overlay '+m.id); }).catch(e=>R('overlay failed '+e.message)); OV.onended=()=>{ ovOn=false; }; }
  if(m.type==='overlayStop'){ ovOn=false; setTimeout(()=>{ if(!ovOn) OV.pause(); },400); }
  if(m.type==='play'){ R('got play '+m.file+' mode='+mode); if(muted||lionOff) return; blobOf(m.file);
    talkQueue.push(m.file);
    // a talk interrupts whatever muted clip (idle/dance) is on screen right now — unless a clip with sound is playing (then it waits)
    if(holdTalk) return; if(mode!=='talk' || front.paused || !front.src) onEnded(); }
  if(m.type==='spotify'){ R('spotify '+m.title+' playing='+m.playing+' dances='+m.dances.length); spSong=(m.playing&&m.dances.length)?m:null; spDances=m.dances||[]; [...(m.dances||[]),...(m.sings||[])].forEach(blobOf); if(front.paused||!front.src) onEnded(); }
  if(m.type==='idles'){ await loadIdles(); }
  if(m.type==='song'){ plOn=false; startSong(m); }
  if(m.type==='playlist'){ plOn=m.on; plList=m.songs||[]; if(plOn){ if(!songOn()) { plI=-1; nextPl(); } } else { song.pause(); curSong=null; } }
  if(m.type==='stop'){ talkQueue=[]; song.pause(); curSong=null; plOn=false; spDances=[]; mode='idle'; if(CLIP.classList.contains('on')) clipDone(); onEnded(); }
};
if(QS.get('vcam')||QS.get('live')||PREVIEW||OVERLAY) setTimeout(()=>{ const s=document.getElementById('start'); if(s) s.click(); },600);
// send the lion's sound only to a chosen output (e.g. the headset's "Game" channel) so Live Studio can take just that
async function routeAudio(label){
  try{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t=>t.stop()); }catch(e){ R('mic permission: '+e.message); }
  const outs=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind==='audiooutput');
  const m=outs.filter(x=>x.label.toLowerCase().includes(label.toLowerCase())); const d=m.find(x=>!/^(default|communications)/i.test(x.label))||m[0];
  if(!d){ R('no audio output matching '+label+' — have: '+outs.map(o=>o.label).join(' / ')); return; }
  for(const el of [A,B,song,CLIP]) { try{ await el.setSinkId(d.deviceId); }catch(e){ R('setSinkId: '+e.message); } }
  R('audio -> '+d.label);
}
if(QS.get('out')) routeAudio(QS.get('out'));
setInterval(()=>{ for(const el of [A,B]){ if(!el.paused && el.muted===false && el.volume<1) el.volume=1; } R('audio: ctx='+AC.state+' gainA='+(gains.A?gains.A.gain.value:'?')+' gainB='+(gains.B?gains.B.gain.value:'?')+' A.paused='+A.paused+' B.paused='+B.paused); }, 15000);
