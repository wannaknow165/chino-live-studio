<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>נשיקה לכולם — בדיקת שקיפות</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101015;color:#f4f1e9;font:16px system-ui}main{display:flex;gap:28px;justify-content:center;padding:24px;flex-wrap:wrap}section{width:min(370px,90vw)}h1{font-size:26px;color:#f8d883}p{line-height:1.7;color:#c6c2cb}button,a{font:inherit;border:1px solid #514052;border-radius:10px;background:#27212b;color:#fff;padding:12px;cursor:pointer;text-decoration:none}button.primary{background:#cb477c;border:0;font-weight:700;width:100%}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.stage{position:relative;height:min(86vh,800px);aspect-ratio:9/16;overflow:hidden;border-radius:14px;background:repeating-conic-gradient(#333 0 25%,#555 0 50%) 0 0/32px 32px}.stage.lion{background:#141414 url('preview-background.png') center/cover}.stage.dark{background:#111}.stage.light{background:#fafafa}video{position:absolute;width:100%;height:100%;inset:0;object-fit:contain}.badge{font-size:13px;color:#aa9bb1}#status{min-height:3em;color:#f8d883}#alpha{color:#a5dfb5;font-size:14px}
</style>
<main><section><div class="badge">תצוגה מקדימה מקומית • אינה מפעילה שידור</div><h1>💋 נשיקה לכולם</h1><p>הנשיקות וההתפרצות הוורודה מעל רקע שקוף. אפקט חד־פעמי של 5.8 שניות.</p><button id="play" class="primary">💋 נגן בדיקה</button><div class="buttons"><button data-bg="lion">האריה</button><button data-bg="">משבצות שקיפות</button><button data-bg="dark">רקע כהה</button><button data-bg="light">רקע בהיר</button></div><div id="status" role="status">מוכן לבדיקה</div><div id="alpha"></div><p>האריה כאן הוא תמונת הרקע להמחשה. מחוות הנשיקה של היד עדיין אינה מחוברת לאפקט.</p><div class="buttons"><a href="kiss-burst-alpha.webm" download>קובץ ההתפרצות השקוף</a><a href="kiss-clean-alpha.webm" download>נשיקה מקורית שקופה</a><a href="/" target="_blank">דשבורד האפקטים</a></div></section><div class="stage lion" id="stage"><video id="fx" src="kiss-burst-alpha.webm" muted playsinline preload="auto"></video></div></main>
<script>
const fx=document.getElementById('fx'),play=document.getElementById('play'),status=document.getElementById('status'),alpha=document.getElementById('alpha');
let checked=false;
play.onclick=async()=>{play.disabled=true;fx.currentTime=0;status.textContent='מנגן…';try{await fx.play()}catch{status.textContent='לא ניתן לנגן את הקובץ. נסה שוב.';play.disabled=false}};
fx.onended=()=>{status.textContent='הסתיים — האפקט נעלם';play.disabled=false};
fx.onerror=()=>{status.textContent='שגיאה בטעינת הווידאו';play.disabled=false};
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{document.getElementById('stage').className='stage '+b.dataset.bg});
fx.ontimeupdate=()=>{if(checked||fx.currentTime<.6||fx.currentTime>2)return;const c=document.createElement('canvas');c.width=fx.videoWidth;c.height=fx.videoHeight;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(fx,0,0);const pixels=ctx.getImageData(0,0,c.width,c.height).data;let zero=0,partial=0,solid=0;for(let i=3;i<pixels.length;i+=4){if(pixels[i]===0)zero++;else if(pixels[i]===255)solid++;else partial++}checked=true;alpha.dataset.result=zero>0&&partial>0&&solid>0?'passed':'failed';alpha.dataset.counts=JSON.stringify({zero,partial,solid});alpha.textContent=alpha.dataset.result==='passed'?'✓ שקיפות אמיתית אומתה בנגן, כולל קצוות חצי־שקופים':'לא הצלחנו לאמת שקיפות בנגן הזה';};
</script></html>
