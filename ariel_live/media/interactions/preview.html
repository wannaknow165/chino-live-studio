<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>צ׳ינו — תצוגת אינטראקציה פרטית</title>
  <style>
    :root{color-scheme:dark;--gold:#efc471;--dim:#a6b4be;--line:#2c3943}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090e13;color:#f1f4f6;font-family:system-ui,"Segoe UI",sans-serif}
    main{max-width:990px;margin:auto;padding:18px 16px 26px}header{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:15px}h1{margin:0;font-size:21px;font-weight:700}.private{padding:6px 11px;border:1px solid #386254;background:#142b25;border-radius:30px;color:#a8e2cb;font-size:12px;white-space:nowrap}
    .layout{display:grid;grid-template-columns:minmax(220px,405px) minmax(240px,1fr);gap:22px;align-items:start;direction:ltr}aside{direction:rtl;padding:18px;border:1px solid var(--line);border-radius:14px;background:#121b23}.hint{color:var(--dim);font-size:13px;line-height:1.8;margin:12px 0}#status{font-size:16px;line-height:1.7;min-height:52px;margin:0 0 13px}#status[data-error=true]{color:#ffb8a9}.buttons{display:flex;flex-wrap:wrap;gap:8px}button{font:600 14px system-ui;border:1px solid transparent;border-radius:10px;padding:11px 15px;background:var(--gold);color:#161b20;cursor:pointer}button.secondary{background:#1f2d39;color:#e6edf1;border-color:#354957}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #69c9f1;outline-offset:3px}
    #stage{position:relative;width:100%;aspect-ratio:9/16;background:#050709;border:1px solid #35424b;border-radius:14px;overflow:hidden;isolation:isolate}#base,#composite,#finished{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#composite{z-index:1;pointer-events:none}#finished{z-index:2;pointer-events:none}#overlay{display:none}.caption{color:var(--dim);font-size:12px;line-height:1.7;margin-top:9px}#errorDetails{white-space:pre-wrap;color:#ffb8a9;font-size:13px;line-height:1.7}#errorDetails:empty{display:none}
    @media(max-width:660px){main{padding:13px 10px 22px}header{flex-wrap:wrap;gap:8px}h1{font-size:19px}.layout{display:flex;flex-direction:column;gap:12px}.layout>section{width:100%}#stage{width:min(100%,430px);height:auto;aspect-ratio:9/16;max-height:none;margin:auto}aside{width:100%;padding:14px}#status{min-height:0;font-size:15px}}
  </style>
</head>
<body>
<main>
  <header><h1 id="title">צ׳ינו מרים את התרנגולת</h1><span class="private">תצוגה פרטית · לא עולה ללייב</span></header>
  <div class="layout">
    <section>
      <div id="stage" data-state="loading">
        <video id="base" playsinline preload="auto" muted></video>
        <canvas id="composite" width="720" height="1280" aria-label="אינטראקציית האריה והתרנגולת"></canvas>
        <canvas id="finished" width="720" height="1280" hidden aria-hidden="true"></canvas>
      </div>
      <p class="caption">בדיקת האחיזה והתנועה בלבד. המופע הציבורי אינו משתנה מכאן.</p>
    </section>
    <aside>
      <p id="status" role="status" aria-live="polite">טוען את תנועת האריה והתרנגולת…</p>
      <div class="buttons">
        <button id="play" disabled>הפעל תצוגה עם קול</button>
        <button id="pause" class="secondary" disabled>השהה לבדיקה</button>
        <button id="stop" class="secondary" disabled>עצור תצוגה</button>
        <button id="mute" class="secondary" disabled aria-pressed="true">הפעל קול</button>
        <button id="retry" class="secondary" hidden>נסה טעינה מחדש</button>
      </div>
      <p class="hint">בודקים הצמדה של הכרבולת לכף. תנועת האריה הנוכחית עולה מהמשענת; הרמה מלאה מהרצפה עדיין לא אומתה.</p>
      <p id="errorDetails" role="alert"></p>
    </aside>
  </div>
  <video id="overlay" playsinline preload="auto" muted aria-hidden="true"></video>
</main>
<script type="module" src="/media/interactions/runtime/preview.js"></script>
</body>
</html>
