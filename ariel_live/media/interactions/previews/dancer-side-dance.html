<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><title>צ׳ינו והרקדנית — תצוגה פרטית</title><style>body{background:#13100c;color:#eedfc7;font:16px sans-serif;text-align:center;margin:12px}#stage{position:relative;width:min(90vw,430px);aspect-ratio:9/16;margin:auto;background:#000}#lion,#layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#asset{display:none}button{background:#d9ab4d;padding:12px;border:0;border-radius:10px;margin:8px}p{margin:8px}</style><p>תצוגה פרטית · תבנית הריקוד אושרה לשימוש</p><button id="play">הצג ריקוד יחד</button><div id="stage"><video id="lion" muted playsinline preload="auto" src="/media/dance/chino-dancer-side-openrouter.mp4" poster="/media/master.png"></video><canvas id="layer" width="720" height="1280"></canvas></div><video id="asset" muted playsinline preload="auto" src="/media/overlays/ov_turk_vs_ahmadmardwi_mw9fp6s1.webm"></video><p id="status">הרקדנית משמאל; האריה רוקד מאחוריה</p><script type="module">import {SideDance} from '/media/interactions/runtime/side-dance.js';const b=document.querySelector('#lion'),v=document.querySelector('#asset'),out=document.querySelector('#status');let renderer;document.querySelector('#play').onclick=async()=>{try{await Promise.all([b,v].map(x=>x.readyState>=2?Promise.resolve():new Promise((ok,no)=>{x.addEventListener('loadeddata',ok,{once:true});x.addEventListener('error',no,{once:true});x.load();})));renderer?.destroy();b.pause();if(b.currentTime!==0){await new Promise(ok=>{b.addEventListener('seeked',ok,{once:true});b.currentTime=0;});}const t=await(await fetch('/media/interactions/templates/dancer_side_dance.json')).json();renderer=new SideDance({canvas:document.querySelector('#layer'),baseVideo:b,overlayVideo:v,muteOverlay:true,onState:s=>out.textContent='ריקוד משולב · שכבה נפרדת · '+s.state,onFinish:()=>out.textContent='הבדיקה הסתיימה — אפשר להפעיל שוב'});renderer.play({id:'private-review',profile:t.profile,sourceTrack:{width:v.videoWidth,height:v.videoHeight}});await b.play();}catch(e){out.textContent='שגיאה בתצוגה: '+e.message;}};</script></html>
