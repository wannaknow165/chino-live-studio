<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><title>צ׳ינו מאכיל תינוק — בדיקה פרטית</title><style>body{background:#13100c;color:#eedfc7;font:16px sans-serif;text-align:center;margin:12px}#stage{position:relative;width:min(90vw,430px);aspect-ratio:9/16;margin:auto;background:#000}#lion,#layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#asset{display:none}#status{font-size:13px;overflow-wrap:anywhere}button{background:#d9ab4d;padding:12px;border:0;border-radius:10px;margin:8px}</style><p>בדיקה פרטית — עדיין לא מופעל בלייב</p><button id="play">הצג האכלה</button><button id="contact">הצג מגע בקבוק ופה</button><label><input type="checkbox" id="sound" checked>בכי התינוק</label><div id="stage"><video id="lion" muted playsinline preload="auto" src="/media/generated/chino-baby-feeding-home.mp4" poster="/media/master.png"></video><canvas id="layer" width="720" height="1280"></canvas></div><video id="asset" muted playsinline preload="auto" src="/media/interactions/previews/baby-observed-preview-audio.webm"></video><p id="status">מוכן לבדיקה פרטית</p><script type="module">import {TrackedInteraction} from '/media/interactions/runtime/tracked-interaction.js';const b=document.querySelector('#lion'),v=document.querySelector('#asset'),out=document.querySelector('#status');let renderer;async function run(contact=false){try{await Promise.all([b,v].map(x=>x.readyState>=2?Promise.resolve():new Promise((ok,no)=>{x.addEventListener('loadeddata',ok,{once:true});x.addEventListener('error',no,{once:true});x.load();})));renderer?.destroy();b.pause();const target=contact?4:0;if(b.currentTime!==target){await new Promise(ok=>{b.addEventListener('seeked',ok,{once:true});b.currentTime=target;});}const t=await(await fetch('/media/interactions/templates/baby_bottle_feed.json')).json(),track=await(await fetch('/media/interactions/previews/baby-observed-preview.feed.json')).json();renderer=new TrackedInteraction({canvas:document.querySelector('#layer'),baseVideo:b,overlayVideo:v,muteOverlay:!document.querySelector('#sound').checked,onState:s=>out.textContent=({on_ground:'התינוק בצד שמאל',holding:'האריה מאכיל — הבכי מתנגן',lowering:'מחזיר את הכף למשענת'})[s.state]||s.state,onFinish:s=>out.textContent='הבדיקה הסתיימה: '+s.reason});renderer.play({id:'private-baby',profile:t.profile,sourceTrack:track});if(contact){if(v.seeking)await new Promise(ok=>v.addEventListener('seeked',ok,{once:true}));renderer.tick();}else await b.play();}catch(e){out.textContent='שגיאה: '+e.message;}}document.querySelector('#play').onclick=()=>run(false);document.querySelector('#contact').onclick=()=>run(true);</script></html>
